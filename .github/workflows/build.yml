on:
  push:
    branches:
    - fr
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5.0.0
    - name: Build Docker Image
      run: docker build . -t $DOCKERU/ryuu-play:latest
    - name: Push Docker Image
      run: docker login -u $DOCKERU -p $DOCKERP && docker push $DOCKERU/ryuu-play:latest
